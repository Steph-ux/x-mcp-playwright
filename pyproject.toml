[project]
name = "x-mcp-playwright"
version = "1.2.0"
description = "Comprehensive Twitter/X MCP server using Playwright (patchright stealth)"
authors = [{ name = "stephanea" }]
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.27.0",
    "patchright>=1.60.0",
    "pydantic>=2.0.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
x-mcp-server = "x_mcp_server:main"
x-mcp-login  = "login:main"

[tool.setuptools]
py-modules = ["x_mcp_server", "login", "fetch_tweets", "utils"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
